# UART Companion role config — C5 detection-frame relay + BLE RID observer
# (carrier-v3)
#
# Build with: -DEXTRA_CONF_FILE="boards/common/uart_companion.conf"
#
# Headless: no phone pairing. Reads ESP32-C5 detection frames over a
# dedicated UART (EUSART1 on XIAO MG24 — see the paired uart_companion.overlay
# in this directory) AND scans locally over BLE for ASTM F3411 RemoteID
# adverts (increment 4 — see src/ble_rid_observer.{h,cpp}); both paths relay
# to a pinned drone-base contact as MeshCore TXT_MSGs. A USB/console serial
# CLI (helpers/CommonCLI, shared with the repeater role) is still available
# for bench diagnostics.

# ========== Role Selection ==========
CONFIG_ZEPHCORE_ROLE_UART_COMPANION=y

# ========== BLE: observer only (no phone pairing) ==========
# This role needs the BLE radio ONLY to passively scan for ASTM F3411 RID
# adverts — never to advertise, connect, or pair. zephcore_common.conf
# defaults BT=y with a full peripheral+GATT+SMP+bonding stack sized for the
# phone-companion role (main_companion.cpp); that's dead weight (and RAM/
# flash cost) for a scan-only role, so BT_PERIPHERAL/BT_CENTRAL are forced
# off here — with no BT_CONN use anywhere, Kconfig drops the entire
# SMP/bonding/settings/DIS/GATT-service chain below it (the explicit "=n"
# lines are for clarity in review, not strictly required to make the build
# small — see the increment 4 report for the measured RAM/flash delta).
# BT_EXT_ADV stays OFF (zephcore_common.conf default): ASTM F3411's primary
# BLE transport is Legacy Advertising (31-byte AD, fits our 25-byte ODID
# body comfortably — see nrf52_ble_scanner/src/main.cpp, which catches it
# with the equivalent Nordic legacy-scan API, no ext-adv machinery needed).
# Revisit only if bench testing shows a broadcaster that's ext-adv-only.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_SMP=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_BONDING_REQUIRED=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_DIS=n
CONFIG_BT_GATT_SERVICE_CHANGED=n

# ========== Entropy ==========
# Needed regardless of BT state for Ed25519 mesh-identity key generation,
# LoRa random delays, etc. BT=y (above) also pulls this in transitively on
# most platforms, but keep it explicit rather than relying on that.
CONFIG_ENTROPY_GENERATOR=y

# ========== C5 UART ==========
# Interrupt-driven RX for the C5 detection-frame link (see
# `zephcore,c5-uart` chosen node in the paired uart_companion.overlay).
CONFIG_UART_INTERRUPT_DRIVEN=y

# ========== Headless: no button/joystick UI ==========
# The carrier-v3 board has no buttons/display/buzzer. Some boards (e.g.
# XIAO MG24) default CONFIG_INPUT=y for an onboard button unrelated to this
# role, which would otherwise pull in helpers/ui-button/ui_task.c (the
# button-driven page UI) — that file calls into helpers/ui/ui_mesh_actions.cpp
# (mesh_send_zerohop_advert / mesh_gps_set_enabled / etc.), which is
# companion-only and not part of this role's CMake target_sources. Force the
# button UI off so the CMake role branch's headless-stub fallback
# (helpers/ui/ui_headless_stubs.c) is what actually links.
CONFIG_ZEPHCORE_UI_BUTTONS=n
