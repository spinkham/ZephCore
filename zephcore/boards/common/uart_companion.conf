# UART Companion role config — C5 detection-frame relay (carrier-v3, Phase 2)
#
# Build with: -DEXTRA_CONF_FILE="boards/common/uart_companion.conf"
#
# Headless: no BLE, no phone pairing. Reads ESP32-C5 detection frames over a
# dedicated UART (EUSART1 on XIAO MG24 — see the paired uart_companion.overlay
# in this directory) and relays them to a pinned drone-base contact as
# MeshCore TXT_MSGs. A USB/console serial CLI (helpers/CommonCLI, shared with
# the repeater role) is still available for bench diagnostics.

# ========== Role Selection ==========
CONFIG_ZEPHCORE_ROLE_UART_COMPANION=y

# ========== Disable BLE entirely ==========
# No phone pairing for this role — configuration/diagnostics are via the
# serial CLI, and the only mesh peer of interest is the pinned drone-base.
CONFIG_BT=n

# ========== Entropy (required when BT is disabled) ==========
# BT normally pulls in the entropy subsystem. Without BT, we need it explicitly
# for Ed25519 key generation, LoRa random delays, etc.
CONFIG_ENTROPY_GENERATOR=y

# ========== C5 UART ==========
# Interrupt-driven RX for the C5 detection-frame link (see
# `zephcore,c5-uart` chosen node in the paired uart_companion.overlay).
CONFIG_UART_INTERRUPT_DRIVEN=y

# ========== Headless: no button/joystick UI ==========
# The carrier-v3 board has no buttons/display/buzzer. Some boards (e.g.
# XIAO MG24) default CONFIG_INPUT=y for an onboard button unrelated to this
# role, which would otherwise pull in helpers/ui-button/ui_task.c (the
# button-driven page UI) — that file calls into helpers/ui/ui_mesh_actions.cpp
# (mesh_send_zerohop_advert / mesh_gps_set_enabled / etc.), which is
# companion-only and not part of this role's CMake target_sources. Force the
# button UI off so the CMake role branch's headless-stub fallback
# (helpers/ui/ui_headless_stubs.c) is what actually links.
CONFIG_ZEPHCORE_UI_BUTTONS=n
